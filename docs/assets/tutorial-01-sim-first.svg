<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4dd8e6"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0a832"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0d1526"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#2a3f66" stroke-width="2"/>

  <!-- title -->
  <text x="800" y="70" text-anchor="middle" fill="#4dd8e6" font-size="20" letter-spacing="8">TUTORIAL 1</text>
  <text x="800" y="130" text-anchor="middle" font-size="56" font-weight="bold">
    <tspan fill="#f5f1e8">Sim-First </tspan><tspan fill="#4dd8e6">Workflow</tspan>
  </text>
  <text x="800" y="170" text-anchor="middle" fill="#f0a832" font-size="20">write RTL &#183; run testbenches &#183; compare against Python golden models</text>

  <!-- Panel 1: Python golden -->
  <g>
    <rect x="60" y="220" width="340" height="280" rx="8" fill="#131f38" stroke="#2a3f66" stroke-width="2"/>
    <text x="230" y="255" text-anchor="middle" fill="#4dd8e6" font-size="20" font-weight="bold">1. PYTHON GOLDEN MODEL</text>
    <text x="85" y="295" fill="#8fa3c7" font-size="15">gen_vectors.py  (seed fixed)</text>
    <text x="85" y="330" fill="#c9d6ee" font-size="15">score = bin(a &amp; b)</text>
    <text x="85" y="352" fill="#c9d6ee" font-size="15">          .count("1")</text>
    <text x="85" y="390" fill="#8fa3c7" font-size="15">writes to vectors/:</text>
    <text x="105" y="418" fill="#7de8a0" font-size="15">bitset_a.hex   (inputs)</text>
    <text x="105" y="440" fill="#7de8a0" font-size="15">bitset_b.hex</text>
    <text x="105" y="462" fill="#f0a832" font-size="15">expected_*.hex (truth)</text>
    <text x="230" y="488" text-anchor="middle" fill="#8fa3c7" font-size="14">200 bitset + 100 dot8 cases</text>
  </g>

  <!-- Panel 2: RTL -->
  <g>
    <rect x="460" y="220" width="340" height="280" rx="8" fill="#131f38" stroke="#2a3f66" stroke-width="2"/>
    <text x="630" y="255" text-anchor="middle" fill="#4dd8e6" font-size="20" font-weight="bold">2. RTL (DUT)</text>
    <text x="485" y="295" fill="#8fa3c7" font-size="15">02-golden-models/rtl/</text>
    <text x="485" y="330" fill="#c9d6ee" font-size="15">popcount.v  W=128</text>
    <text x="485" y="355" fill="#c9d6ee" font-size="15">popand.v    a &amp; b</text>
    <text x="485" y="380" fill="#c9d6ee" font-size="15">hamming.v   a ^ b</text>
    <text x="485" y="405" fill="#c9d6ee" font-size="15">dot8.v      acc += a*b</text>
    <text x="485" y="445" fill="#8fa3c7" font-size="14">rule: no #delays, no initial,</text>
    <text x="485" y="465" fill="#8fa3c7" font-size="14">&lt;= in clocked, = in comb</text>
  </g>

  <!-- Panel 3: testbench -->
  <g>
    <rect x="860" y="220" width="340" height="280" rx="8" fill="#131f38" stroke="#2a3f66" stroke-width="2"/>
    <text x="1030" y="255" text-anchor="middle" fill="#4dd8e6" font-size="20" font-weight="bold">3. SELF-CHECKING TB</text>
    <text x="885" y="295" fill="#8fa3c7" font-size="15">iverilog -g2012 / vvp</text>
    <text x="885" y="330" fill="#c9d6ee" font-size="15">$readmemh(vectors)</text>
    <text x="885" y="355" fill="#c9d6ee" font-size="15">drive DUT, sample #1</text>
    <text x="885" y="380" fill="#c9d6ee" font-size="15">if (got !== want)</text>
    <text x="885" y="405" fill="#e05555" font-size="15">    $fatal(1)  // make stops</text>
    <text x="885" y="445" fill="#8fa3c7" font-size="14">$dumpvars -&gt; .vcd -&gt; gtkwave</text>
    <text x="885" y="465" fill="#8fa3c7" font-size="14">waveforms when it fails</text>
  </g>

  <!-- Panel 4: verdict -->
  <g>
    <rect x="1260" y="220" width="280" height="280" rx="8" fill="#131f38" stroke="#2a3f66" stroke-width="2"/>
    <text x="1400" y="255" text-anchor="middle" fill="#4dd8e6" font-size="20" font-weight="bold">4. VERDICT</text>
    <rect x="1290" y="285" width="220" height="60" rx="6" fill="#12301f" stroke="#2e7d4f"/>
    <text x="1400" y="322" text-anchor="middle" fill="#7de8a0" font-size="18">PASS: 500 cases</text>
    <rect x="1290" y="360" width="220" height="60" rx="6" fill="#331418" stroke="#8d3038"/>
    <text x="1400" y="397" text-anchor="middle" fill="#e05555" font-size="18">FAIL: exit != 0</text>
    <text x="1400" y="455" text-anchor="middle" fill="#8fa3c7" font-size="14">one command: make</text>
    <text x="1400" y="477" text-anchor="middle" fill="#8fa3c7" font-size="14">CI runs the same thing</text>
  </g>

  <!-- arrows row 1 -->
  <line x1="400" y1="360" x2="455" y2="360" stroke="#4dd8e6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="800" y1="360" x2="855" y2="360" stroke="#4dd8e6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="1200" y1="360" x2="1255" y2="360" stroke="#4dd8e6" stroke-width="3" marker-end="url(#arr)"/>

  <!-- bottom band: only after green -->
  <g>
    <rect x="60" y="560" width="1480" height="250" rx="8" fill="#101a30" stroke="#2a3f66" stroke-width="2"/>
    <text x="800" y="598" text-anchor="middle" fill="#f0a832" font-size="20" font-weight="bold">ONLY AFTER THE SIM IS GREEN DOES HARDWARE ENTER THE PICTURE</text>

    <rect x="110" y="630" width="400" height="140" rx="8" fill="#131f38" stroke="#2a3f66"/>
    <text x="310" y="665" text-anchor="middle" fill="#4dd8e6" font-size="17" font-weight="bold">SYNTHESIS (open flow)</text>
    <text x="140" y="700" fill="#c9d6ee" font-size="15">yosys -&gt; nextpnr-himbaechel</text>
    <text x="140" y="725" fill="#c9d6ee" font-size="15">      -&gt; gowin_pack -&gt; .fs</text>
    <text x="140" y="755" fill="#8fa3c7" font-size="14">same RTL, zero edits</text>

    <rect x="600" y="630" width="400" height="140" rx="8" fill="#131f38" stroke="#2a3f66"/>
    <text x="800" y="665" text-anchor="middle" fill="#4dd8e6" font-size="17" font-weight="bold">FLASH</text>
    <text x="630" y="700" fill="#c9d6ee" font-size="15">openFPGALoader -b tangnano20k</text>
    <text x="630" y="725" fill="#c9d6ee" font-size="15">    top.fs</text>
    <text x="630" y="755" fill="#8fa3c7" font-size="14">Tang Nano 20K &#183; GW2AR-18 &#183; 27 MHz in</text>

    <rect x="1090" y="630" width="400" height="140" rx="8" fill="#131f38" stroke="#2a3f66"/>
    <text x="1290" y="665" text-anchor="middle" fill="#4dd8e6" font-size="17" font-weight="bold">OBSERVE</text>
    <text x="1120" y="700" fill="#c9d6ee" font-size="15">LED blinks / HDMI shows bars /</text>
    <text x="1120" y="725" fill="#c9d6ee" font-size="15">UART prints reports</text>
    <text x="1120" y="755" fill="#8fa3c7" font-size="14">bugs found here = electrical/timing</text>

    <line x1="510" y1="700" x2="595" y2="700" stroke="#f0a832" stroke-width="3" marker-end="url(#arrO)"/>
    <line x1="1000" y1="700" x2="1085" y2="700" stroke="#f0a832" stroke-width="3" marker-end="url(#arrO)"/>
  </g>

  <text x="800" y="855" text-anchor="middle" fill="#8fa3c7" font-size="16" letter-spacing="4">SIM-FIRST &#183; FAST FEEDBACK &#183; CATCH BUGS EARLY &#183; CONFIDENCE BEFORE SILICON</text>
</svg>
